<!doctype html>
<!--
  Renders a looping promo video (MP4, H.264) for posting natively on LinkedIn,
  Instagram, X and so on: the spirograph builds itself in from black while
  the TuneIn title and tagline zoom in, then everything fades back to black
  so the loop is seamless.

  Every frame is drawn at an exact time with the game's own spirograph code
  and encoded with the browser's WebCodecs encoder via Mediabunny, so the
  output is smooth and identical every run.

  To render: run `npm run dev`, open
    http://localhost:5173/scripts/promo-video.html?w=1920&h=1080
  (or ?w=1080&h=1080 for square, ?w=1080&h=1350 for 4:5) and click Render.
  The page offers the MP4 as a download when it's done.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TuneIn promo video</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #eee;
        font: 14px system-ui, sans-serif;
      }
      canvas {
        display: block;
        max-width: 100vw;
        max-height: 85vh;
      }
      .bar {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="bar"><button id="render" type="button">Render</button><span id="status">Ready</span></div>
    <canvas id="video"></canvas>
    <script type="module">
      import '@fontsource-variable/quicksand'
      import { BufferTarget, CanvasSource, Mp4OutputFormat, Output, QUALITY_HIGH } from 'mediabunny'
      import { DESIGNS, drawFrame } from '/src/components/spirograph.ts'

      const params = new URLSearchParams(location.search)
      const W = Number(params.get('w') ?? 1920)
      const H = Number(params.get('h') ?? 1080)
      const FPS = 30
      const DURATION = 12 // seconds
      const wide = W / H > 1.2

      const canvas = document.getElementById('video')
      canvas.width = W
      canvas.height = H
      const ctx = canvas.getContext('2d')

      // Draw the pattern at a scale where the 1.2px lines survive video compression.
      const pixelRatio = Math.max(1, Math.min(W, H) / 720)
      const view = { width: W / pixelRatio, height: H / pixelRatio, pixelRatio, glow: true }

      const flower = (design, x, y, size, angle, reverse = false) => ({ design, x, y, size, angle, reverse })
      const ring = wide ? flower(DESIGNS[2], 74, 50, 92, 20) : flower(DESIGNS[2], 50, 50, 105, 20)
      const ellipse = wide ? flower(DESIGNS[0], 68, 46, 110, -24, true) : flower(DESIGNS[0], 50, 46, 125, -24, true)

      const clamp01 = (x) => Math.min(1, Math.max(0, x))
      const easeOut = (x) => 1 - (1 - x) ** 3

      /** 0 → 1 over [start, start + length] seconds, eased. */
      const ramp = (t, start, length) => easeOut(clamp01((t - start) / length))

      function drawText(text, x, y, size, weight, color, t, start) {
        const p = ramp(t, start, 1.1)
        if (p <= 0) return
        ctx.save()
        ctx.translate(x, y)
        ctx.scale(0.7 + 0.3 * p, 0.7 + 0.3 * p) // zoom in
        ctx.globalAlpha = p
        ctx.fillStyle = color
        ctx.font = `${weight} ${size}px "Quicksand Variable", system-ui, sans-serif`
        ctx.textAlign = wide ? 'left' : 'center'
        ctx.textBaseline = 'middle'
        ctx.fillText(text, 0, 0)
        ctx.restore()
      }

      function draw(t) {
        // The pattern: the ring builds from t = 0, the ellipse from t = 1.5s.
        const visible = [{ flower: ring, elapsed: t * 1000 }]
        if (t > 1.5) visible.push({ flower: ellipse, elapsed: (t - 1.5) * 1000 })
        drawFrame(ctx, visible, view)

        ctx.setTransform(1, 0, 0, 1, 0, 0)
        ctx.globalCompositeOperation = 'source-over'
        ctx.globalAlpha = 1

        const unit = Math.min(W, H) / 1080
        const textX = wide ? W * 0.075 : W / 2
        const centerY = wide ? H / 2 : H * 0.5

        // Soft dark pool behind the words so they stay crisp over the lines.
        const poolX = wide ? textX + 330 * unit : W / 2
        const pool = ctx.createRadialGradient(poolX, centerY, 0, poolX, centerY, 620 * unit)
        pool.addColorStop(0, `rgba(0,0,0,${0.9 * ramp(t, 0.3, 1)})`)
        pool.addColorStop(1, 'rgba(0,0,0,0)')
        ctx.fillStyle = pool
        ctx.fillRect(0, 0, W, H)

        drawText('TuneIn', textX, centerY - 95 * unit, 230 * unit, 700, '#f5efe8', t, 0.5)
        drawText('Name the artist. Name the song.', textX, centerY + 70 * unit, 62 * unit, 600, '#ffb59a', t, 1.4)
        drawText('10 songs · up to 30 points · beat the leaderboard', textX, centerY + 150 * unit, 36 * unit, 500, '#b0a598', t, 2.2)

        // Fade everything to black at the end so the loop restarts seamlessly.
        const out = clamp01((t - (DURATION - 1.5)) / 1.5)
        if (out > 0) {
          ctx.fillStyle = `rgba(0,0,0,${out})`
          ctx.fillRect(0, 0, W, H)
        }
      }

      async function render() {
        const status = document.getElementById('status')
        await document.fonts.load('700 100px "Quicksand Variable"')
        const output = new Output({ format: new Mp4OutputFormat({ fastStart: 'in-memory' }), target: new BufferTarget() })
        const source = new CanvasSource(canvas, { codec: 'avc', bitrate: QUALITY_HIGH })
        output.addVideoTrack(source, { frameRate: FPS })
        await output.start()

        const frames = FPS * DURATION
        for (let f = 0; f < frames; f++) {
          draw(f / FPS)
          await source.add(f / FPS, 1 / FPS)
          if (f % 30 === 0) status.textContent = `Rendering ${Math.round((f / frames) * 100)}%`
        }
        await output.finalize()
        const blob = new Blob([output.target.buffer], { type: 'video/mp4' })
        status.textContent = `Done: ${(blob.size / 1e6).toFixed(1)} MB`
        window.__video = blob

        const link = document.createElement('a')
        link.href = URL.createObjectURL(blob)
        link.download = `tunein-${W}x${H}.mp4`
        link.click()
        return blob.size
      }

      window.renderVideo = render
      window.drawAt = draw
      document.getElementById('render').addEventListener('click', render)
      draw(4)
      document.fonts.ready.then(() => {
        draw(4)
        document.body.setAttribute('data-ready', '')
      })
    </script>
  </body>
</html>
