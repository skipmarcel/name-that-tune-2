<!doctype html>
<!--
  Source for public/og-image.jpg, the 1200×630 link-preview image shown when
  the game is shared on LinkedIn, X, iMessage and so on.

  To regenerate: run `npm run dev`, open http://localhost:5173/scripts/og-image.html
  at exactly 1200×630 (e.g. a headless browser screenshot), and save it as
  public/og-image.jpg (JPEG keeps it around 400 KB). It draws with the
  game's own spirograph code.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TuneIn share image</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #000;
      }
      canvas {
        position: absolute;
        inset: 0;
      }
      .text {
        position: absolute;
        left: 88px;
        top: 50%;
        transform: translateY(-50%);
        color: #f5efe8;
        font-family: 'Quicksand Variable', system-ui, sans-serif;
      }
      /* A soft dark pool behind the words keeps them crisp over the lines. */
      .text::before {
        content: '';
        position: absolute;
        inset: -120px -160px -120px -200px;
        z-index: -1;
        background: radial-gradient(closest-side, rgb(0 0 0 / 92%), rgb(0 0 0 / 0%));
      }
      h1 {
        margin: 0;
        font-size: 168px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 18px 0 0;
        font-size: 46px;
        font-weight: 600;
        color: #ffb59a;
      }
      .small {
        margin-top: 26px;
        font-size: 28px;
        font-weight: 500;
        color: #b0a598;
      }
    </style>
  </head>
  <body>
    <canvas id="art" width="1200" height="630"></canvas>
    <div class="text">
      <h1>TuneIn</h1>
      <p>Name the artist. Name the song.</p>
      <p class="small">10 songs · up to 30 points · beat the leaderboard</p>
    </div>
    <script type="module">
      import '@fontsource-variable/quicksand'
      import { BUILD_MS, DESIGNS, drawFrame } from '/src/components/spirograph.ts'

      const ctx = document.getElementById('art').getContext('2d')
      const flower = (design, x, y, size, angle) => ({ design, x, y, size, angle, reverse: false })
      // Two fully drawn designs, overlapping on the right: a ring and an ellipse.
      drawFrame(
        ctx,
        [
          { flower: flower(DESIGNS[2], 76, 50, 92, 20), elapsed: BUILD_MS + 500 },
          { flower: flower(DESIGNS[0], 70, 46, 110, -24), elapsed: BUILD_MS + 500 },
        ],
        { width: 1200, height: 630, pixelRatio: 1, glow: true },
      )
      document.fonts.ready.then(() => document.body.setAttribute('data-ready', ''))
    </script>
  </body>
</html>
